# Remoto de CondoHub: modulo ES que el shell importa desde otro origen (por eso CORS abierto en lectura)
server {
    listen 80;
    root /usr/share/nginx/html;
    add_header Access-Control-Allow-Origin * always;
    # el navegador revalida siempre: una imagen nueva del remoto se ve al recargar
    add_header Cache-Control "no-cache" always;
    # La raíz responde 200 para el chequeo de salud de Docker: un remoto solo sirve remoteEntry.js y su raíz daba 404.
    location = / { default_type text/plain; return 200 "ok"; }
    location / { try_files $uri =404; }
}